services:
  operadash:
    ports: !reset []
    environment:
      OPERADASH_ALLOW_HTTP: "0"
      OPERADASH_TRUST_PROXY: "1"
  https:
    image: caddy:2-alpine
    environment:
      OPERADASH_DOMAIN: ${OPERADASH_DOMAIN:?Defina o dominio do OperaDash}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      operadash:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
